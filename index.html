<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Rocket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #0f1422;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 640px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #debug-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 15, 25, 0.88);
      color: #fff;
      font-size: 11px;
      padding: 6px 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    #debug-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(20, 28, 48, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 12;
      backdrop-filter: blur(4px);
    }
    #audio-toggle-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(20, 28, 48, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 12;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="debug-banner">
      <span><strong style="color:#4cd964;">GREEN</strong>: Sprite | <strong style="color:#ff3b30;">RED</strong>: Buggy Hitbox</span>
      <span style="color:#ffd700;">[BUG HUNT]</span>
    </div>
    <button id="audio-toggle-btn" title="Toggle Sound ON/OFF">🔊 Sound: ON</button>
    <button id="debug-toggle-btn" title="Toggle Hitbox Debug View">Hitbox: OFF</button>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const debugBanner = document.getElementById("debug-banner");
    const debugToggleBtn = document.getElementById("debug-toggle-btn");
    const audioToggleBtn = document.getElementById("audio-toggle-btn");

    const SCREEN_WIDTH = 400;
    const SCREEN_HEIGHT = 600;

    const GRAVITY = 0.42;
    const THRUST_IMPULSE = -7.4;
    const MAX_FALL_SPEED = 9.5;

    const OBSTACLE_SPEED = 2.8;
    const OBSTACLE_GAP = 160;
    const OBSTACLE_WIDTH = 68;
    const OBSTACLE_FREQUENCY = 1500;

    const STATE_START = "START";
    const STATE_PLAYING = "PLAYING";
    const STATE_GAME_OVER = "GAME_OVER";

    let gameState = STATE_START;
    let score = 0;
    let highScore = 0;
    let debugHitbox = false;
    let audioEnabled = true;
    let lastSpawnTime = 0;

    const imgRocket = new Image();
    imgRocket.src = "assets/images/rocket.png";

    const imgObstacle = new Image();
    imgObstacle.src = "assets/images/obstacle.png";

    const imgBackground = new Image();
    imgBackground.src = "assets/images/background.png";

    const sndThrust = new Audio("assets/sounds/thrust.wav");
    sndThrust.volume = 0.35;

    const sndScore = new Audio("assets/sounds/score.wav");
    sndScore.volume = 0.50;

    const sndLose = new Audio("assets/sounds/lose-2.wav");
    sndLose.volume = 0.70;

    const musicBg = new Audio("assets/sounds/ob-1.wav");
    musicBg.loop = true;
    musicBg.volume = 0.65;

    let audioUnlocked = false;
    function unlockAudio() {
      if (!audioUnlocked) {
        musicBg.play().then(() => {
          musicBg.pause();
          musicBg.currentTime = 0;
          audioUnlocked = true;
        }).catch(() => {});
      }
    }

    class MotionStar {
      constructor() {
        this.x = Math.random() * SCREEN_WIDTH;
        this.y = Math.random() * SCREEN_HEIGHT;
        this.speed = 0.8 + Math.random() * 1.5;
        this.size = 1.5 + Math.random() * 2;
        this.twinkle = Math.random() * Math.PI * 2;
      }
      update(multiplier = 1.0) {
        this.x -= this.speed * multiplier;
        if (this.x < -10) {
          this.x = SCREEN_WIDTH + 10;
          this.y = Math.random() * SCREEN_HEIGHT;
        }
      }
      draw(c, time) {
        const alpha = 0.6 + 0.4 * Math.sin(time * 0.003 + this.twinkle);
        c.fillStyle = "rgba(255, 235, 150, " + alpha + ")";
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
      }
    }
    const stars = Array.from({ length: 45 }, () => new MotionStar());

    class Rocket {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 52;
        this.height = 36;
        this.velocityY = 0;
        this.angle = 0;
      }
      thrust() {
        this.velocityY = THRUST_IMPULSE;
        if (audioEnabled) {
          try {
            sndThrust.currentTime = 0;
            sndThrust.play().catch(() => {});
          } catch (e) {}
        }
      }
      update() {
        this.velocityY += GRAVITY;
        if (this.velocityY > MAX_FALL_SPEED) this.velocityY = MAX_FALL_SPEED;
        this.y += this.velocityY;
        this.angle = Math.max(-30, Math.min(70, -this.velocityY * 3.5));
      }
      getHitbox() {
        // =====================================================================
        // TODO: Fix collision/physics bug here (Web Edition)
        // ---------------------------------------------------------------------
        // Notice the artificial forward offset (+18px) and extra height (+16px).
        // Correct to: { x: this.x, y: this.y, width: this.width, height: this.height }
        // =====================================================================
        const buggyForwardOffset = 18;
        const buggyExtraHeight = 16;
        return {
          x: this.x
          y: this.y
          width: this.width,
          height: this.height + buggyExtraHeight
        };
      }
      draw(c) {
        c.save();
        c.translate(this.x + this.width / 2, this.y + this.height / 2);
        c.rotate((this.angle * Math.PI) / 180);
        if (imgRocket.complete && imgRocket.naturalWidth > 0) {
          c.drawImage(imgRocket, -this.width / 2, -this.height / 2, this.width, this.height);
        } else {
          c.fillStyle = "#ffffff";
          c.beginPath();
          c.ellipse(0, 0, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();
      }
    }

    class Obstacle {
      constructor(x) {
        this.x = x;
        this.width = OBSTACLE_WIDTH;
        this.passed = false;
        const margin = 60;
        this.gapY = Math.floor(Math.random() * (SCREEN_HEIGHT - margin * 2 - OBSTACLE_GAP)) + margin;
        this.topHeight = this.gapY;
        this.bottomY = this.gapY + OBSTACLE_GAP;
        this.bottomHeight = SCREEN_HEIGHT - this.bottomY;
      }
      update() {
        this.x -= OBSTACLE_SPEED;
      }
      getTopRect() {
        return { x: this.x, y: 0, width: this.width, height: this.topHeight };
      }
      getBottomRect() {
        return { x: this.x, y: this.bottomY, width: this.width, height: this.bottomHeight };
      }
      draw(c) {
        if (imgObstacle.complete && imgObstacle.naturalWidth > 0) {
          c.save();
          c.translate(this.x + this.width / 2, this.topHeight);
          c.scale(1, -1);
          c.drawImage(imgObstacle, -this.width / 2, 0, this.width, SCREEN_HEIGHT);
          c.restore();

          c.drawImage(imgObstacle, this.x, this.bottomY, this.width, SCREEN_HEIGHT);

          c.fillStyle = "rgba(255, 100, 60, 0.9)";
          c.fillRect(this.x, this.topHeight - 6, this.width, 6);
          c.fillRect(this.x, this.bottomY, this.width, 6);
        } else {
          c.fillStyle = "#4a5a75";
          c.fillRect(this.x, 0, this.width, this.topHeight);
          c.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
        }
      }
    }

    let rocket = new Rocket(80, SCREEN_HEIGHT / 2 - 20);
    let obstacles = [];

    function checkCollision(r1, r2) {
      return (
        r1.x < r2.x + r2.width &&
        r1.x + r1.width > r2.x &&
        r1.y < r2.y + r2.height &&
        r1.y + r1.height > r2.y
      );
    }

    function startGameplay() {
      unlockAudio();
      gameState = STATE_PLAYING;
      rocket.thrust();
      if (audioEnabled) {
        try {
          sndLose.pause();
          sndLose.currentTime = 0;
          musicBg.currentTime = 0;
          musicBg.play().catch(() => {});
        } catch (e) {}
      }
    }

    // -------------------------------------------------------------------------
    // 60 FPS FIXED TIMESTEP GAME LOOP
    // Prevents game from running at 2x/3x turbo speed on 90Hz, 120Hz, or 144Hz screens!
    // -------------------------------------------------------------------------
    const TARGET_FPS = 60;
    const STEP = 1000 / TARGET_FPS; // 16.66ms per physics update
    let lastTime = 0;
    let accumulator = 0;
    let spawnTimer = 0;
    let hoverTime = 0;

    function resetGame() {
      rocket = new Rocket(80, SCREEN_HEIGHT / 2 - 20);
      obstacles = [];
      score = 0;
      spawnTimer = 0;
    }

    function handleAction() {
      if (gameState === STATE_START) {
        startGameplay();
      } else if (gameState === STATE_PLAYING) {
        rocket.thrust();
      } else if (gameState === STATE_GAME_OVER) {
        resetGame();
        startGameplay();
      }
    }

    window.addEventListener("touchstart", (e) => {
      if (e.target === debugToggleBtn || e.target === audioToggleBtn) return;
      e.preventDefault();
      handleAction();
    }, { passive: false });

    window.addEventListener("mousedown", (e) => {
      if (e.target === debugToggleBtn || e.target === audioToggleBtn) return;
      handleAction();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        handleAction();
      } else if (e.code === "KeyR" && gameState === STATE_GAME_OVER) {
        resetGame();
        startGameplay();
      } else if (e.code === "KeyH") {
        toggleDebug();
      } else if (e.code === "KeyM") {
        toggleAudio();
      }
    });

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      audioToggleBtn.textContent = audioEnabled ? "🔊 Sound: ON" : "🔇 Sound: OFF";
      audioToggleBtn.style.color = audioEnabled ? "#ffffff" : "#ff6b6b";
      audioToggleBtn.style.borderColor = audioEnabled ? "rgba(255, 255, 255, 0.3)" : "rgba(235, 50, 65, 0.7)";
      if (!audioEnabled) {
        try {
          musicBg.pause();
          sndLose.pause();
        } catch (e) {}
      } else {
        if (gameState === STATE_PLAYING) {
          try {
            musicBg.play().catch(() => {});
          } catch (e) {}
        }
      }
    }
    audioToggleBtn.addEventListener("click", toggleAudio);

    function toggleDebug() {
      debugHitbox = !debugHitbox;
      debugBanner.style.display = debugHitbox ? "flex" : "none";
      debugToggleBtn.textContent = `Hitbox: ${debugHitbox ? "ON" : "OFF"}`;
      debugToggleBtn.style.color = debugHitbox ? "#4cd964" : "#ffffff";
    }
    debugToggleBtn.addEventListener("click", toggleDebug);

    function updatePhysics() {
      const starSpeed = gameState === STATE_PLAYING ? 1.0 : 0.4;
      stars.forEach((s) => s.update(starSpeed));

      if (gameState === STATE_START) {
        hoverTime += 0.05;
        rocket.y = SCREEN_HEIGHT / 2 - 20 + Math.sin(hoverTime) * 8;
      } else if (gameState === STATE_PLAYING) {
        rocket.update();

        spawnTimer += STEP;
        if (spawnTimer >= OBSTACLE_FREQUENCY) {
          obstacles.push(new Obstacle(SCREEN_WIDTH + 10));
          spawnTimer = 0;
        }

        for (let i = 0; i < obstacles.length; i++) {
          const obs = obstacles[i];
          obs.update();
          if (!obs.passed && obs.x + obs.width < rocket.x) {
            obs.passed = true;
            score++;
            if (audioEnabled) {
              try {
                sndScore.currentTime = 0;
                sndScore.play().catch(() => {});
              } catch (e) {}
            }
            if (score > highScore) highScore = score;
          }
        }

        obstacles = obstacles.filter((obs) => obs.x + obs.width >= -10);

        const hitbox = rocket.getHitbox();
        let crashed = rocket.y < -10 || rocket.y + rocket.height > SCREEN_HEIGHT;
        for (let obs of obstacles) {
          if (checkCollision(hitbox, obs.getTopRect()) || checkCollision(hitbox, obs.getBottomRect())) {
            crashed = true;
            break;
          }
        }

        if (crashed) {
          gameState = STATE_GAME_OVER;
          try {
            musicBg.pause();
            if (audioEnabled) {
              sndLose.currentTime = 0;
              sndLose.play().catch(() => {});
            }
          } catch (e) {}
        }
      }
    }

    function render(time) {
      // 1. Background
      if (imgBackground.complete && imgBackground.naturalWidth > 0) {
        ctx.drawImage(imgBackground, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
      } else {
        ctx.fillStyle = "#cce0ff";
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
      }

      // 2. Stars
      stars.forEach((s) => s.draw(ctx, time));

      // 3. Obstacles
      obstacles.forEach((obs) => obs.draw(ctx));

      // 4. Rocket
      rocket.draw(ctx);

      // 5. Hitbox Debug Overlay
      if (debugHitbox) {
        ctx.strokeStyle = "#4cd964";
        ctx.lineWidth = 2;
        ctx.strokeRect(rocket.x, rocket.y, rocket.width, rocket.height);

        const h = rocket.getHitbox();
        ctx.strokeStyle = "#ff3b30";
        ctx.strokeRect(h.x, h.y, h.width, h.height);

        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 1;
        obstacles.forEach((obs) => {
          const top = obs.getTopRect();
          const bot = obs.getBottomRect();
          ctx.strokeRect(top.x, top.y, top.width, top.height);
          ctx.strokeRect(bot.x, bot.y, bot.width, bot.height);
        });
      }

      // 6. UI Overlays
      ctx.textAlign = "center";
      if (gameState === STATE_START) {
        ctx.fillStyle = "rgba(20, 28, 50, 0.75)";
        ctx.fillRect(SCREEN_WIDTH / 2 - 140, 130, 280, 50);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("FLAPPY ROCKET", SCREEN_WIDTH / 2, 165);

        ctx.fillStyle = "rgba(20, 28, 50, 0.7)";
        ctx.fillRect(SCREEN_WIDTH / 2 - 120, 340, 240, 42);
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("TAP to Launch", SCREEN_WIDTH / 2, 367);

        ctx.fillStyle = "#18203a";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText("Tap 🔊 button or press 'M' to mute", SCREEN_WIDTH / 2, 415);
      } else if (gameState === STATE_PLAYING) {
        ctx.fillStyle = "rgba(20, 28, 50, 0.75)";
        ctx.fillRect(SCREEN_WIDTH / 2 - 60, 20, 120, 36);
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2;
        ctx.strokeRect(SCREEN_WIDTH / 2 - 60, 20, 120, 36);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`SCORE: ${score}`, SCREEN_WIDTH / 2, 45);
      } else if (gameState === STATE_GAME_OVER) {
        ctx.fillStyle = "rgba(15, 20, 35, 0.88)";
        ctx.fillRect(SCREEN_WIDTH / 2 - 140, 180, 280, 200);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.strokeRect(SCREEN_WIDTH / 2 - 140, 180, 280, 200);

        ctx.fillStyle = "#ff453a";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("MISSION FAILED", SCREEN_WIDTH / 2, 225);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`Score: ${score}`, SCREEN_WIDTH / 2, 270);

        ctx.fillStyle = "#ffd700";
        ctx.fillText(`Best: ${highScore}`, SCREEN_WIDTH / 2, 305);

        ctx.fillStyle = "#00d2ff";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("TAP to Retry", SCREEN_WIDTH / 2, 350);
      }
    }

    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      let dt = time - lastTime;
      lastTime = time;

      // Cap delta time to prevent spiral of death on background tab switches
      if (dt > 100) dt = 100;
      accumulator += dt;

      // Run fixed 60 FPS physics updates
      while (accumulator >= STEP) {
        updatePhysics();
        accumulator -= STEP;
      }

      render(time);
      requestAnimationFrame(gameLoop);
    }

    // Start single loop
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
